name: Build, test, and lint

# Runs the exact verification this project's README promises but could not
# be executed in the sandbox that generated it: a real Android SDK + real
# network access to Google's Maven repository, on GitHub's own runners.
#
# Trigger it by pushing to any branch, opening a pull request, or manually
# from the Actions tab ("Run workflow").
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: clean test lint assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Handles Gradle dependency + wrapper caching automatically.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # This is the exact command the spec asks for. If anything below
      # fails, the job fails and the log shows precisely what broke.
      - name: clean test lint assembleDebug
        run: ./gradlew clean test lint assembleDebug --stacktrace

      - name: Compute APK SHA-256
        if: always()
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            sha256sum "$APK_PATH" | tee app-debug-sha256.txt
          else
            echo "APK not found at $APK_PATH (build likely failed earlier)" | tee app-debug-sha256.txt
          fi

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug-sha256.txt
          if-no-files-found: warn

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  # Optional, manual-only job: runs the one instrumented test
  # (KeystoreCryptoInstrumentedTest) against a real emulator, since the
  # AndroidKeyStore provider it needs isn't available under Robolectric.
  # Kept out of the default push/PR trigger because emulator boot makes it
  # much slower — run it from the Actions tab when you specifically want
  # to verify the Keystore-backed encryption path.
  instrumented-test:
    name: connectedAndroidTest (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: app/build/reports/androidTests/
          if-no-files-found: warn
